<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Svelte SPA Example</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top left, rgba(120, 180, 255, 0.2), transparent 30%),
          linear-gradient(180deg, #f7fbff 0%, #edf3f8 100%);
      }

      #app {
        min-height: 100vh;
      }
    </style>
    <!-- bundler-runtime chunks default to ES module output, so the entry is a
         module script and the lazy chunks arrive through import(). No query
         string: lazy chunks import "./main.js", and a module URL that differs
         by even a query is a second module instance with its own state. -->
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
