<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jQuery Externs Demo</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f7f5ef;
        color: #1f2a37;
      }

      .shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .panel {
        background: white;
        border: 1px solid #d9d2c3;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 14px 40px rgba(31, 42, 55, 0.08);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: #ece5d8;
        color: #6d4c20;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status {
        margin-top: 16px;
        font-size: 18px;
      }

      .status.active {
        color: #0f766e;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: #1f6feb;
        color: white;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }

      button.secondary {
        background: #374151;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <span class="chip">Extern Generation</span>
        <h1>jQuery runtime contract demo</h1>
        <p>
          This example exists to exercise boundary-aware extern generation
          against the large ambient type surface provided by jQuery.
        </p>
        <div id="status" class="status">Idle</div>
        <div class="actions">
          <button id="toggle-button" type="button">Toggle Active</button>
          <button id="reset-button" class="secondary" type="button">Reset</button>
        </div>
      </section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
