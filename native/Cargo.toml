[package]
name = "gcc_ts_bundler_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

# Oxc owns native parsing, semantics, TypeScript/JSX lowering, transforms,
# visitation, and printing. Keep the family pinned together because its Rust API
# changes between minor releases.
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_parser = "=0.142.0"
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"
oxc_transformer = "=0.142.0"
oxc_codegen = "=0.142.0"
oxc_ast_visit = "=0.142.0"
oxc_str = "=0.142.0"
oxc_syntax = "=0.142.0"

[build-dependencies]
napi-build = "2.3.2"
