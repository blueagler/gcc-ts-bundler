[package]
name = "gcc_ts_bundler_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.4", default-features = false, features = ["napi8"] }
napi-derive = "3.6.5"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

# Oxc owns native parsing, semantics, TypeScript/JSX lowering, transforms,
# visitation, and printing. Keep the family pinned together because its Rust API
# changes between minor releases.
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_semantic = "=0.150.0"
oxc_span = "=0.150.0"
oxc_transformer = "=0.150.0"
oxc_codegen = "=0.150.0"
oxc_ast_visit = "=0.150.0"
oxc_str = "=0.150.0"
oxc_syntax = "=0.150.0"
oxc_minifier = "=0.150.0"

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
# Keep unwinding enabled: napi-rs cannot convert an aborting panic to a JS
# exception, and this addon has no proof that all dependency panics are unreachable.

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
match_same_arms = "allow"
unused_async = "allow"
manual_let_else = "allow"
used_underscore_binding = "allow"
ref_option_ref = "allow"
ref_option = "allow"
format_push_string = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes = "deny"
result_large_err = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
# cast_lossless remains enabled by pedantic.
# indexing_slicing is deliberately not enabled.
# The repository is one native crate; package lints avoid an artificial workspace.
