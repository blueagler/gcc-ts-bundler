[package]
name = "gcc_ts_bundler_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
swc_core = { version = "74.0.2", features = ["common", "ecma_ast", "ecma_codegen", "ecma_parser", "ecma_visit"] }
swc_ecma_transforms_base = "46.0.1"
swc_ecma_transforms_react = "52.0.0"
swc_ecma_transforms_typescript = "52.0.0"

# oxc owns the three parse islands that never share an AST with the transpile
# monolith: the graph import scanner, the post-Closure `exports.rs` rewrite and
# the bundler-runtime output verifier. Pinned exactly - these crates break API
# on every minor and the islands read spans and semantics directly.
oxc_allocator = "=0.142.0"
oxc_ast = "=0.142.0"
oxc_parser = "=0.142.0"
oxc_semantic = "=0.142.0"
oxc_span = "=0.142.0"
# The swap adds what the islands did not need: TS/JSX lowering, a printer, the
# visitor traits and the arena string type. Same exact pin, same reason.
oxc_transformer = "=0.142.0"
oxc_codegen = "=0.142.0"
oxc_ast_visit = "=0.142.0"
oxc_str = "=0.142.0"
oxc_syntax = "=0.142.0"

[build-dependencies]
napi-build = "2.3.2"
