name: Native Packages

on:
  pull_request:
    paths:
      - ".github/workflows/native-packages.yml"
      - "native/**"
      - "scripts/build-native.mjs"
      - "src/native/**"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-packages.yml"
      - "native/**"
      - "scripts/build-native.mjs"
      - "src/native/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without publishing packages
        required: false
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  rust-hygiene:
    name: Rust hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features -- -D warnings

  build-native-package:
    name: ${{ matrix.package_name }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: gcc-ts-bundler-darwin-arm64
            runs_on: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - package_name: gcc-ts-bundler-darwin-x64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - package_name: gcc-ts-bundler-linux-arm64-gnu
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            libc: gnu
          - package_name: gcc-ts-bundler-linux-arm64-musl
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            libc: musl
            cargo_command: zigbuild
          - package_name: gcc-ts-bundler-linux-x64-gnu
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            libc: gnu
          - package_name: gcc-ts-bundler-linux-x64-musl
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x64
            libc: musl
            cargo_command: zigbuild
          - package_name: gcc-ts-bundler-win32-arm64-msvc
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32
            arch: arm64
          - package_name: gcc-ts-bundler-win32-x64-msvc
            runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: ${{ matrix.cargo_command == 'zigbuild' }}
        name: Install Zig 0.15.2
        shell: bash
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          ZIG_VERSION: 0.15.2
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              zig_arch=x86_64
              zig_sha256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              ;;
            ARM64)
              zig_arch=aarch64
              zig_sha256=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
              ;;
            *)
              echo "Unsupported runner.arch: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          archive="zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz"
          archive_path="$RUNNER_TEMP/$archive"
          zig_dir="$RUNNER_TEMP/zig-${zig_arch}-linux-${ZIG_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive_path" \
            "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          printf '%s  %s\n' "$zig_sha256" "$archive_path" | sha256sum --check --status
          tar -xJf "$archive_path" -C "$RUNNER_TEMP"
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version

      - if: ${{ matrix.cargo_command == 'zigbuild' }}
        shell: bash
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_NAME: ${{ matrix.package_name }}
          LIBC: ${{ matrix.libc }}
          CARGO_COMMAND: ${{ matrix.cargo_command }}
        run: |
          args=(
            --skip-root-copy
            --target "$TARGET"
            --platform "$PLATFORM"
            --arch "$ARCH"
            --package-name "$PACKAGE_NAME"
          )

          if [ -n "$LIBC" ]; then
            args+=(--libc "$LIBC")
          fi

          if [ -n "$CARGO_COMMAND" ]; then
            args+=(--cargo-command "$CARGO_COMMAND")
          fi

          node ./scripts/build-native.mjs "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: npm/${{ matrix.package_name }}

      - if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          version=$(node -p "require('./npm/${{ matrix.package_name }}/package.json').version")
          if npm view "${{ matrix.package_name }}@${version}" version >/dev/null 2>&1; then
            echo "${{ matrix.package_name }}@${version} is already published; skipping"
            exit 0
          fi
          args=(npm publish "./npm/${{ matrix.package_name }}" --access public)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          "${args[@]}"

  publish-root-package:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    permissions:
      contents: read
      id-token: write
    needs:
      - build-native-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: gcc-ts-bundler-*
          path: npm
          merge-multiple: false

      - run: cp npm/gcc-ts-bundler-linux-x64-gnu/index.node native/index.node

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run build:js

      - shell: bash
        run: |
          npm install -g npm@^11.5.1
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; skipping"
            exit 0
          fi
          args=(npm publish --access public)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          "${args[@]}"
